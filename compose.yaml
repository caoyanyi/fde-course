name: fde-learning

services:
  app:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      COURSE_PATH: /app/course/curriculum.json
      APP_SETUP_TOKEN: ${APP_SETUP_TOKEN:?Run python3 scripts/configure.py first}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Run python3 scripts/configure.py first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AI_PRIVATE_HOST_ALLOWLIST: ${AI_PRIVATE_HOST_ALLOWLIST:-}
      MAX_REVIEWS_PER_DAY: ${MAX_REVIEWS_PER_DAY:-100}
      MAX_MATERIALS_PER_DAY: ${MAX_MATERIALS_PER_DAY:-100}
    volumes:
      - fde_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:8080"
    depends_on:
      app:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fde_data:
